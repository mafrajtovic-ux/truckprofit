<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TruckProfit</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: white;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px;
}

h1 {
    font-size: 38px;
    margin-bottom: 5px;
}

.logo {
    color: #ffb000;
}

.subtitle {
    color: #9da7b3;
    margin-bottom: 30px;
}

.card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    display: block;
    color: #9da7b3;
    font-size: 14px;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: white;
}

button {
    margin-top: 20px;
    padding: 13px 20px;
    border: none;
    border-radius: 8px;
    background: #ffb000;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

.results {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.result {
    background: #0d1117;
    padding: 15px;
    border-radius: 10px;
}

.result span {
    color: #9da7b3;
    font-size: 13px;
}

.result strong {
    display: block;
    font-size: 22px;
    margin-top: 6px;
}

@media(max-width:650px) {
    .grid,
    .results {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Truck<span class="logo">Profit</span></h1>

<div class="subtitle">
Pre nego što prihvatiš turu — izračunaj profit.
</div>

<div class="card">

<h2>Kalkulator ture</h2>

<div class="grid">

<div>
<label>Ukupno kilometara</label>
<input id="km" type="number" value="650">
</div>

<div>
<label>Potrošnja (L/100 km)</label>
<input id="consumption" type="number" value="28">
</div>

<div>
<label>Cena dizela (RSD/L)</label>
<input id="fuelPrice" type="number" value="183">
</div>

<div>
<label>Putarine (RSD)</label>
<input id="toll" type="number" value="12000">
</div>

<div>
<label>Vozač / dnevnice (RSD)</label>
<input id="driver" type="number" value="15000">
</div>

<div>
<label>Održavanje (RSD/km)</label>
<input id="maintenance" type="number" value="18">
</div>

<div>
<label>AdBlue (RSD)</label>
<input id="adblue" type="number" value="0">
</div>

<div>
<label>Ostali troškovi (RSD)</label>
<input id="other" type="number" value="0">
</div>

<div>
<label>Ponuđena cena ture (RSD)</label>
<input id="price" type="number" value="90000">
</div>

<div>
<label>Ciljana marža (%)</label>
<input id="margin" type="number" value="20">
</div>

</div>

<button onclick="calculate()">IZRAČUNAJ PROFIT</button>

</div>

<div class="card">

<h2>Rezultat</h2>

<div class="results">

<div class="result">
<span>Gorivo</span>
<strong id="fuelCost">0 RSD</strong>
</div>

<div class="result">
<span>Ukupan trošak</span>
<strong id="totalCost">0 RSD</strong>
</div>

<div class="result">
<span>Profit / gubitak</span>
<strong id="profit">0 RSD</strong>
</div>

<div class="result">
<span>Trošak po km</span>
<strong id="costKm">0 RSD</strong>
</div>

<div class="result">
<span>Profit po km</span>
<strong id="profitKm">0 RSD</strong>
</div>

<div class="result">
<span>Stvarna marža</span>
<strong id="actualMargin">0%</strong>
</div>

<div class="result">
<span>Minimalna cena za ciljanu maržu</span>
<strong id="minimumPrice">0 RSD</strong>
</div>

</div>

</div>

</div>

<script>

function money(value) {
    return Math.round(value).toLocaleString("sr-RS") + " RSD";
}

function calculate() {

    const km = Number(document.getElementById("km").value) || 0;
    const consumption = Number(document.getElementById("consumption").value) || 0;
    const fuelPrice = Number(document.getElementById("fuelPrice").value) || 0;
    const toll = Number(document.getElementById("toll").value) || 0;
    const driver = Number(document.getElementById("driver").value) || 0;
    const maintenance = Number(document.getElementById("maintenance").value) || 0;
    const adblue = Number(document.getElementById("adblue").value) || 0;
    const other = Number(document.getElementById("other").value) || 0;
    const price = Number(document.getElementById("price").value) || 0;
    const margin = Number(document.getElementById("margin").value) || 0;

    const fuelCost =
        km * consumption / 100 * fuelPrice;

    const maintenanceCost =
        km * maintenance;

    const totalCost =
        fuelCost +
        maintenanceCost +
        toll +
        driver +
        adblue +
        other;

    const profit =
        price - totalCost;

    const costKm =
        km > 0 ? totalCost / km : 0;

    const profitKm =
        km > 0 ? profit / km : 0;

    const actualMargin =
        price > 0 ? profit / price * 100 : 0;

    const minimumPrice =
        margin < 100
        ? totalCost / (1 - margin / 100)
        : 0;

    document.getElementById("fuelCost").innerText =
        money(fuelCost);

    document.getElementById("totalCost").innerText =
        money(totalCost);

    document.getElementById("profit").innerText =
        money(profit);

    document.getElementById("costKm").innerText =
        money(costKm);

    document.getElementById("profitKm").innerText =
        money(profitKm);

    document.getElementById("actualMargin").innerText =
        actualMargin.toFixed(1) + "%";

    document.getElementById("minimumPrice").innerText =
        money(minimumPrice);
}

calculate();

</script>

</body>
</html>
